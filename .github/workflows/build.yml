name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  # Do not leave an obsolete FFmpeg build occupying a Windows runner for hours.
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  EVEREST_VERSION: stable-1.6485.0

jobs:
  test:
    name: Rust checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Test capture subscriptions and clocks
        run: dotnet run --project Tests/Capture/Capture.csproj -c Release

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-checks-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --manifest-path Native/Cargo.toml -- --check

      - name: Run native tests
        run: cargo test --workspace --locked

  prepare-release:
    name: Prepare release
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      release_tag: ${{ steps.release.outputs.release_tag }}
    steps:
      - name: Prepare draft release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/master" ]]; then
            release_tag="nightly"
            title="Nightly ${GITHUB_SHA:0:7}"
            notes="Automated nightly build from commit \`$GITHUB_SHA\`."

            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$release_tag" >/dev/null 2>&1; then
              gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$release_tag" \
                -f sha="$GITHUB_SHA" \
                -F force=true >/dev/null
            else
              gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
                -f ref="refs/tags/$release_tag" \
                -f sha="$GITHUB_SHA" >/dev/null
            fi

            if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release edit "$release_tag" \
                --repo "$GITHUB_REPOSITORY" \
                --draft \
                --prerelease \
                --latest=false \
                --title "$title" \
                --notes "$notes"
              gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' |
                while IFS= read -r asset; do
                  [[ -z "$asset" ]] || gh release delete-asset "$release_tag" "$asset" \
                    --repo "$GITHUB_REPOSITORY" --yes
                done
            else
              gh release create "$release_tag" \
                --repo "$GITHUB_REPOSITORY" \
                --draft \
                --prerelease \
                --title "$title" \
                --notes "$notes" \
                --verify-tag
            fi
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            release_tag="$GITHUB_REF_NAME"
            if ! gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release create "$release_tag" \
                --repo "$GITHUB_REPOSITORY" \
                --draft \
                --generate-notes \
                --verify-tag
            fi
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: [test, prepare-release]
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            artifact: MicroblocksQolUtils-windows-x64
          - name: Linux x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: MicroblocksQolUtils-linux-x64
          - name: macOS x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            artifact: MicroblocksQolUtils-macos-x64
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Rust target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}

      - name: Cache minimal FFmpeg build
        if: needs.prepare-release.outputs.publish == 'true'
        uses: actions/cache@v6
        with:
          path: .cache/ffmpeg
          key: ffmpeg-${{ matrix.target }}-${{ hashFiles('scripts/qol-ffmpeg.mjs') }}

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          clang libclang-dev libvpl-dev
          libffmpeg-nvenc-dev make patchelf pkg-config xz-utils unzip zip

      - name: Install Windows build tools
        if: runner.os == 'Windows' && needs.prepare-release.outputs.publish == 'true'
        shell: pwsh
        run: |
          & C:\msys64\usr\bin\pacman.exe -S --needed --noconfirm make perl diffutils mingw-w64-x86_64-nasm
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Download Everest reference assemblies
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .work/everest
          gh release download "$EVEREST_VERSION" \
            --repo EverestAPI/Everest \
            --pattern lib-stripped.zip \
            --dir .work/everest \
            --clobber

      - name: Extract Everest reference assemblies
        if: runner.os != 'Windows'
        run: unzip -q .work/everest/lib-stripped.zip -d .work/everest

      - name: Extract Everest reference assemblies
        if: runner.os == 'Windows'
        shell: pwsh
        run: Expand-Archive -LiteralPath .work/everest/lib-stripped.zip -DestinationPath .work/everest -Force

      - name: Build package
        env:
          CELESTE_ROOT: ${{ github.workspace }}/.work/everest/lib-stripped
        run: >-
          node scripts/build-qol-mod.mjs
          --target ${{ matrix.target }}
          --archive ${{ matrix.artifact }}.zip
          ${{ needs.prepare-release.outputs.publish != 'true' && '--no-ffmpeg' || '' }}

      - name: Verify Linux library
        if: runner.os == 'Linux'
        shell: bash
        run: |
          file Build/Code/lib-linux/libmicroblocks_qol_native.so
          readelf --dyn-syms Build/Code/lib-linux/libmicroblocks_qol_native.so | grep -q mqol_raster_text

      - name: Upload platform package
        if: needs.prepare-release.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          if-no-files-found: error
          retention-days: 1

  merge-packages:
    name: Merge platform packages
    if: needs.prepare-release.outputs.publish == 'true'
    needs: [prepare-release, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install archive tools
        run: sudo apt-get update && sudo apt-get install -y unzip zip

      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: MicroblocksQolUtils-*-x64
          path: .work/platform-packages
          merge-multiple: true

      - name: Merge platform packages
        shell: bash
        run: |
          node scripts/merge-qol-packages.mjs \
            MicroblocksQolUtils.zip \
            .work/platform-packages/MicroblocksQolUtils-windows-x64.zip \
            .work/platform-packages/MicroblocksQolUtils-linux-x64.zip \
            .work/platform-packages/MicroblocksQolUtils-macos-x64.zip
          unzip -Z1 MicroblocksQolUtils.zip | sort

      - name: Upload universal package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          gh release upload "$RELEASE_TAG" MicroblocksQolUtils.zip \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          for asset in \
            MicroblocksQolUtils-windows-x64.zip \
            MicroblocksQolUtils-linux-x64.zip \
            MicroblocksQolUtils-macos-x64.zip; do
            gh release delete-asset "$RELEASE_TAG" "$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --yes || true
          done

  publish-release:
    name: Publish release
    if: needs.prepare-release.outputs.publish == 'true'
    needs: [prepare-release, merge-packages]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          if [[ "$RELEASE_TAG" == "nightly" ]]; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          fi
